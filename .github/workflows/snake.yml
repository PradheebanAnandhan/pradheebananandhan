name: Contribution snake

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#c2410c&color_dots=#ebedf0,#fed7aa,#fdba74,#fb923c,#ea580c
            dist/snake-dark.svg?palette=github-dark&color_snake=#f0883e&color_dots=#161b22,#5a2a0c,#9a3f0f,#d9611a,#f0883e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
