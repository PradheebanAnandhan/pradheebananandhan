<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="Pradheeban A. AI/ML engineer working on LLM systems, RAG and voice agents. Currently at Softura.">
  <style>
    .name { font: 600 48px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -0.5px; }
    .sub  { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .note { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .now  { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c2410c; }
    .box  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.25; }
    .hot  { stroke: #c2410c; }
    .wire { stroke: #c2410c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 5; animation: flow 1.1s linear infinite; }
    .back { animation-direction: reverse; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .wire { animation: none; } }
  </style>

  <text class="name" x="0" y="92">Pradheeban A</text>
  <text class="sub" x="2" y="130">AI/ML engineer · LLM systems, RAG, voice agents</text>
  <text class="now" x="2" y="170">&gt; currently at Softura</text>

  <path class="wire" d="M584 65 H630"/>
  <path class="wire" d="M702 65 H748"/>
  <path class="wire" d="M660 82 V126"/>
  <path class="wire back" d="M672 82 V126"/>

  <rect class="box" x="500" y="48" width="84" height="34" rx="6"/>
  <text class="mono" x="542" y="69.5" text-anchor="middle">voice</text>

  <rect class="box hot" x="630" y="48" width="72" height="34" rx="6"/>
  <text class="mono" x="666" y="69.5" text-anchor="middle">llm</text>

  <rect class="box" x="748" y="48" width="88" height="34" rx="6"/>
  <text class="mono" x="792" y="69.5" text-anchor="middle">answer</text>

  <rect class="box" x="630" y="126" width="72" height="34" rx="6"/>
  <text class="mono" x="666" y="147.5" text-anchor="middle">docs</text>
  <text class="note" x="684" y="108">retrieve</text>
</svg>
